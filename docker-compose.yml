# AgriPump in containers: the API, the two workers, the website (with HTTPS), and optionally PostgreSQL.
#
#   cp deploy/env.example .env        # then fill it in (see deploy/README.md)
#   docker compose --profile db up -d --build      # with the bundled PostgreSQL (fine for a pilot on one server)
#   docker compose up -d --build                    # with an outside PostgreSQL (set DATABASE_URL in .env), for example AWS RDS
#
# Every backend container is the same image (./backend/Dockerfile) started with a different command.
name: agripump

# Only the settings the backend needs are passed in (not the whole .env: the database admin password, for one, is not the backend's business).
x-backend: &backend
  build: ./backend
  image: agripump-backend:latest
  environment:
    ENV: production
    DATABASE_URL: ${DATABASE_URL:-postgresql://agripump:${APP_DB_PASSWORD:-unset}@db:5432/agripump}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    SUPERADMIN_MONITOR_ONLY: ${SUPERADMIN_MONITOR_ONLY:-true}
    PROVISIONING_HOOK_SECRET: ${PROVISIONING_HOOK_SECRET:-}
    MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-superadmin}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-ses}
    EMAIL_FROM: ${EMAIL_FROM:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    GEOCODE_ENABLED: ${GEOCODE_ENABLED:-true}
    AWS_REGION: ${AWS_REGION:-ap-south-1}
    IOT_DATA_ENDPOINT: ${IOT_DATA_ENDPOINT:-}
    IOT_PUBLISH_MODE: ${IOT_PUBLISH_MODE:-aws}
    SQS_INGEST_URL: ${SQS_INGEST_URL:-}
    FIREBASE_SERVICE_ACCOUNT_FILE: ${FIREBASE_SERVICE_ACCOUNT_FILE:-}
    ALERT_SMS_ENABLED: ${ALERT_SMS_ENABLED:-false}
    TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
    TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  volumes:
    # Secret files (for example the Firebase push key) go in ./secrets and are read-only inside the containers.
    - ./secrets:/run/secrets:ro
  restart: unless-stopped

services:
  # PostgreSQL, only when started with `--profile db`. Use a managed database (backups, patches) for anything you cannot afford to lose.
  db:
    profiles: ["db"]
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql
      - ./deploy/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agripump || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Runs the database migrations to the newest version and stops. Safe to run again at every update.
  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
        required: false

  # The API: sign-in, pumps, commands, alerts, the weekly schedule sender, the connectivity sweep. Not published: only the web container reaches it.
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "5000"

  # Reads the starters' readings from the AWS queue and saves them. Without it nothing arrives from the field.
  ingest:
    <<: *backend
    command: ["python", "-m", "app.workers.ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The nightly jobs: daily summaries and keeping the history to its retention period.
  jobs:
    <<: *backend
    command: ["python", "-m", "app.workers.jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The website, HTTPS, and the way in to the API.
  web:
    build: ./web
    image: agripump-web:latest
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
